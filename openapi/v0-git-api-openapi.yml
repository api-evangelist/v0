      security:
      - apiKey: []
  /git/start-chat:
    post:
      operationId: git.startChat.create
      tags:
      - git
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                  description: The namespace (organization or user).
                repo:
                  type: string
                  description: The repository name.
                baseBranch:
                  type: string
                  description: The base branch to start from.
                rootDirectory:
                  description: The root directory of the project within the repository.
                  type: string
                vercelProjectId:
                  description: The Vercel project ID to link to.
                  type: string
                newProjectName:
                  description: Name for a new project to create.
                  type: string
                source:
                  type: string
                  enum:
                  - url
                  - search
                  - duplicate
                  description: The source of the chat creation request.
                isE2ETest:
                  description: Whether this is an e2e test request.
                  type: boolean
              required:
              - namespace
              - repo
              - baseBranch
              - source
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                      const: true
                    value:
                      type: object
                      properties:
                        chatId:
                          type: string
                          description: The ID of the newly created chat.
                        blockId:
                          type: string
                          description: The ID of the initial code block.
                        requiredEnvsAndIntegrations:
                          type: object
                          properties:
                            hasRequirements:
                              type: boolean
                              description: Whether the project has required environment variables or integrations.
                            environmentVariables:
                              type: array
                              items:
                                type: string
                              description: List of required environment variable names.
                            integrations:
                              type: array
                              items:
                                type: string
                              description: List of required integration names.
                          required:
                          - hasRequirements
                          - environmentVariables
                          - integrations
                          additionalProperties: false
                      required:
                      - chatId
                      - blockId
                      - requiredEnvsAndIntegrations
                      additionalProperties: false
                  required:
                  - ok
                  - value
                  additionalProperties: false
                - type: object
                  properties:
                    ok:
                      type: boolean
                      const: false
                    error:
                      type: object
                      properties:
                        error:
                          type: string
                        statusCode:
                          type: number
                        errorCode:
                          type: string
                      required:
                      - error
                      - statusCode
                      - errorCode
                      additionalProperties: false
                  required:
                  - ok
                  - error
                  additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
