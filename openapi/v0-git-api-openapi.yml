              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
        description: The namespace (organization or user).
      - name: repo
        in: path
        required: true
        schema:
          type: string
        description: The repository name.
      - name: search
        in: query
        required: false
        schema:
          description: Search query to filter branches.
          type: string
        description: Search query to filter branches.
      security:
      - apiKey: []
  /git/{org}/{repo}/projects:
    get:
      operationId: git.findProjects
      tags:
      - git
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                      const: true
                    value:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            description: The name from package.json.
                            type: string
                          framework:
                            type: string
                            enum:
                            - next
                            - nuxt
                            - vite
                            - svelte
                            - astro
                            - services
                            - other
                            description: The detected framework.
                          path:
                            type: string
                            description: The path to the project directory.
                          size:
                            description: The size of the package.json in bytes.
                            type: number
                          dependencies:
                            description: List of dependencies.
                            type: array
                            items:
                              type: string
                        required:
                        - framework
                        - path
                        additionalProperties: false
                  required:
                  - ok
                  - value
                  additionalProperties: false
                - type: object
                  properties:
                    ok:
                      type: boolean
                      const: false
                    error:
                      type: object
                      properties:
                        error:
                          type: string
                        statusCode:
                          type: number
                        errorCode:
                          type: string
                      required:
                      - error
                      - statusCode
                      - errorCode
                      additionalProperties: false
                  required:
                  - ok
                  - error
                  additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '413':
          description: Payload Too Large
          content:
