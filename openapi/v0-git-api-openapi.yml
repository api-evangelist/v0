        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - apiKey: []
  /git/connect:
    post:
      operationId: git.connect.create
      tags:
      - git
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chatId:
                  type: string
                  description: The chat ID to connect the repository to.
                owner:
                  type: string
                  description: The Git namespace slug (organization or username).
                repoName:
                  type: string
                  description: The desired repository name.
                blockId:
                  description: Optional block ID to associate with the repository.
                  type: string
              required:
              - chatId
              - owner
              - repoName
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                      const: true
                    value:
                      type: object
                      properties:
                        remoteURL:
                          type: string
                          description: The GitHub repository remote URL.
                        repoName:
                          type: string
                          description: The final repository name (may be deduped).
                        linkedProject:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            accountId:
                              type: string
                            link:
                              type: object
                              properties:
                                type:
                                  type: string
                                org:
                                  type: string
                                repo:
                                  type: string
                                productionBranch:
                                  type: string
                              required:
                              - type
                              - org
                              - repo
                              additionalProperties: false
                          required:
                          - id
                          - name
                          additionalProperties: false
                          description: The Vercel project linked to the repository.
                      required:
                      - remoteURL
                      - repoName
                      - linkedProject
                      additionalProperties: false
                  required:
                  - ok
                  - value
                  additionalProperties: false
                - type: object
                  properties:
                    ok:
                      type: boolean
                      const: false
                    error:
                      type: object
                      properties:
                        error:
                          type: string
                        statusCode:
                          type: number
                        errorCode:
                          type: string
                        existingRepo:
                          type: object
                          properties:
                            org:
                              type: string
                            repo:
                              type: string
                            remoteURL:
                              type: string
                          required:
                          - org
                          - repo
                          - remoteURL
                          additionalProperties: false
                      required:
                      - error
                      - statusCode
                      - errorCode
                      additionalProperties: false
                  required:
                  - ok
                  - error
                  additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - apiKey: []
