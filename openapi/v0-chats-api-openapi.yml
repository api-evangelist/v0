  /chats/{chatId}/tasks/resolve:
    post:
      summary: Resolve Task
      description: Resolves a pending task in a chat, continuing the conversation. The latest message in the active chat fork must be an assistant message currently blocked on a matching task (integration setup, plan approval, question answers, or permission grants).
      operationId: chats.resolveTask
      tags:
      - chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  anyOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        const: confirmed-steps
                      connectedIntegrationNames:
                        default: []
                        description: Names of integrations that were successfully connected (e.g. "Neon", "Supabase"). Pass an empty array to skip.
                        type: array
                        items:
                          type: string
                          enum:
                          - Upstash for Redis
                          - Upstash Search
                          - Neon
                          - Supabase
                          - Amazon Aurora DSQL
                          - Amazon Aurora PostgreSQL
                          - Amazon DynamoDB
                          - firebase
                          - Groq
                          - Grok
                          - fal
                          - Deep Infra
                          - Stripe
                          - Clerk
                          - Convex
                          - Blob
                          - Edge Config
                          - Vercel AI Gateway
                          - Snowflake
                      connectedMcpPresetNames:
                        default: []
                        description: Names of MCP presets that were connected (e.g. "Linear", "Sentry"). Pass an empty array to skip.
                        type: array
                        items:
                          type: string
                          enum:
                          - Linear
                          - Notion
                          - Context7
                          - Sentry
                          - Zapier
                          - Glean
                          - Hex
                          - Sanity
                          - Granola
                          - PostHog
                          - Contentful
                          - Slack
                      appliedScripts:
                        default: []
                        description: Names of scripts that were applied.
                        type: array
                        items:
                          type: string
                          minLength: 1
                      addedEnvVars:
                        default: []
                        description: Names of environment variables that were added.
                        type: array
                        items:
                          type: string
                          minLength: 1
                    required:
                    - type
                    additionalProperties: false
                    description: Resolves an integration installation task. The agent asked the user to install integrations, MCP presets, or set environment variables. Send this after provisioning the integration on Vercel.
                  - type: object
                    properties:
                      type:
                        type: string
                        const: plan-exit-response
                      status:
                        type: string
                        enum:
                        - approved
                        - rejected
                        - request-changes
                        description: Whether the plan is approved, rejected, or needs changes.
                      content:
                        type: string
                        minLength: 1
                        description: Feedback or instructions for the agent.
                    required:
                    - type
                    - status
                    - content
                    additionalProperties: false
                    description: Resolves a plan review task. The agent proposed an implementation plan and is waiting for approval.
                  - type: object
                    properties:
                      type:
                        type: string
                        const: answered-questions
                      answers:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId:
                              type: string
                              minLength: 1
                              description: The ID of the question being answered.
                            questionText:
                              type: string
                              minLength: 1
                              description: The text of the question being answered.
                            selectedLabels:
                              type: array
                              items:
                                type: string
                                minLength: 1
                              description: The labels of the selected options. For single-select questions, pass one item.
                            customText:
                              description: Free-form text input, used when the user selects "Other" or wants to add context.
                              type: string
                              minLength: 1
                          required:
                          - questionId
                          - questionText
                          - selectedLabels
                          additionalProperties: false
                        description: Answers to the questions the agent asked.
                    required:
                    - type
                    - answers
                    additionalProperties: false
                    description: Resolves a question task. The agent asked the user one or more multiple-choice questions.
                  - type: object
                    properties:
                      type:
                        type: string
                        const: confirmed-permissions
                      permissions:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              const: ALLOW_DYNAMIC_TOOL_STRICT
                            toolName:
                              type: string
                              minLength: 1
                              description: The name of the tool being permitted.
                            input:
                              description: The tool call input arguments. Pass the exact input from the stopped task.
                            taskNameActive:
                              description: Label shown while the tool is running (e.g. "Running migration").
                              anyOf:
                              - type: string
                                minLength: 1
                              - type: 'null'
                            taskNameComplete:
                              description: Label shown after the tool completes (e.g. "Migration complete").
                              anyOf:
                              - type: string
                                minLength: 1
                              - type: 'null'
                            userMessage:
                              description: Optional message from the user about this permission.
                              type: string
                              minLength: 1
                          required:
                          - type
                          - toolName
                          - input
                          additionalProperties: false
                        description: The permissions to grant. Pass the suggestedPermissions from the stopped task.
                      userMessage:
                        description: Optional message from the user about the permission grant.
                        type: string
                        minLength: 1
                    required:
                    - type
                    - permissions
                    additionalProperties: false
                    description: Resolves a permission request task. The agent wants to execute a tool (shell command, script, MCP call) and needs approval. Also used to resolve environment variable prompts.
                  description: The task resolution data. The latest message in the active chat fork must be an assistant message blocked on the matching task type.
                responseMode:
                  default: sync
                  description: 'Controls how the response is delivered.


                    - `"sync"`: The response is returned immediately with the HTTP request.

                    - `"async"`: Returns a message placeholder immediately; use getById to poll for completion status and final output.

                    - `"experimental_stream"`: Returns content parts as Server-Sent Events for real-time streaming.'
                  type: string
                  enum:
                  - sync
                  - async
                  - experimental_stream
                modelConfiguration:
                  description: Overrides for the model behavior.
                  type: object
                  properties:
                    modelId:
                      default: v0-pro
                      type: string
                      enum:
                      - v0-auto
                      - v0-mini
                      - v0-pro
                      - v0-max
                      - v0-max-fast
                      description: Model to use for the generation.
                    imageGenerations:
                      default: false
                      type: boolean
                      description: Enables image generations to generate up to 5 images per version.
                    thinking:
